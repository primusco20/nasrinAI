<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F4F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0C0D" media="(prefers-color-scheme: dark)">
  <title>NasrinAI</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Nasrin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/app.css">
  <script src="/character.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="mark" id="mark" aria-hidden="true"></span>
      <span class="wordmark">Nasrin</span>
    </div>
    <div class="bar-actions">
      <button type="button" class="icon-btn" id="settingsBtn" aria-haspopup="dialog" aria-expanded="false" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        <span class="sr-only">Settings</span>
      </button>
      <button type="button" class="text-btn" id="newChat">New chat</button>
    </div>
  </header>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="settingsTitle">Settings</h2>
      <button type="button" class="icon-btn" id="settingsClose" title="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        <span class="sr-only">Close settings</span>
      </button>
    </div>

    <fieldset class="group">
      <legend>Appearance</legend>
      <div class="segmented">
        <label><input type="radio" name="theme" value="system"><span>System</span></label>
        <label><input type="radio" name="theme" value="light"><span>Light</span></label>
        <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
      </div>
    </fieldset>

    <div class="group setting-row">
      <label for="readAloud">Read replies aloud</label>
      <input type="checkbox" role="switch" class="switch" id="readAloud">
    </div>

    <fieldset class="group">
      <legend>Voice</legend>
      <div class="voices" id="voices"></div>
    </fieldset>
  </section>

  <main id="log" class="log" aria-live="polite" aria-relevant="additions">
    <section class="welcome" id="welcome">
      <button type="button" class="hero" id="hero" aria-label="Say hi to Nasrin"></button>
      <h1 class="greeting">Hi, I’m Nasrin.</h1>
      <p class="lede">Ask me anything, in any language.</p>
      <div class="starters" id="starters">
        <button type="button" class="starter">Explain inflation simply</button>
        <button type="button" class="starter">Reply to a customer whose delivery is late</button>
        <button type="button" class="starter">Translate “Thank you for waiting” into Bisaya</button>
        <button type="button" class="starter">Plan a week of meals on a budget</button>
      </div>
    </section>
  </main>

  <footer class="dock">
    <p class="notice" id="notice" role="status"></p>
    <form class="composer" id="composer" autocomplete="off">
      <div class="tray" id="tray" hidden></div>
      <label class="sr-only" for="input">Message</label>
      <textarea id="input" rows="2" maxlength="4000" placeholder="Message Nasrin" enterkeyhint="send"></textarea>
      <div class="tools">
        <button type="button" class="tool" id="attach" title="Add photos and files">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="sr-only">Add photos and files</span>
        </button>
        <input type="file" id="fileInput" multiple hidden
          accept="image/*,application/pdf,.pdf,text/plain,.txt,text/csv,.csv,text/markdown,.md,application/json,.json">
        <span class="model-pick" id="modelRow" hidden>
          <label class="sr-only" for="model">Model</label>
          <select id="model"></select>
        </span>
        <span class="spacer"></span>
        <button type="button" class="mic" id="mic" aria-pressed="false" title="Talk instead of typing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <span class="sr-only">Talk instead of typing</span>
        </button>
        <button type="submit" class="send" id="send" title="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
          <span class="sr-only">Send</span>
        </button>
      </div>
    </form>
    <p class="fineprint" id="fineprint">Replies come from an AI and can be wrong. Check anything important.</p>
  </footer>
</body>
</html>
