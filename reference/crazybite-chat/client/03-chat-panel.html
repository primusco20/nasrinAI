    <!-- SMART CHAT                                  -->

      x-transition:leave="fade-leave"

      x-transition:leave-end="fade-from"
    >

      <div 
        x-show="chatExpanded"
        @click="showChat = false"
        class="absolute inset-0 z-[110] bg-slate-900/50 dark:bg-black/70 backdrop-blur-sm pointer-events-auto"
        x-transition:enter="fade-enter"
        x-transition:enter-start="fade-from"
        x-transition:enter-end="fade-to"
        x-transition:leave="fade-leave"
        x-transition:leave-start="fade-to"
        x-transition:leave-end="fade-from"
      ></div>
      <div class="absolute inset-0 z-[111] pointer-events-none">
        <div 
          @click.stop 
          x-show="showChat"
          data-sheet

          x-transition:enter="rise-enter"

          x-transition:enter-end="rise-to"
          x-transition:leave="rise-leave"
          x-transition:leave-start="rise-to"
          x-transition:leave-end="sink-to"
          class="sheet-layer chat-morph transform-gpu glass-panel absolute flex flex-col overflow-hidden pointer-events-auto border border-black/10 dark:border-white/20"
          :class="(chatListening || chatConvo ? 'chat-listening ' : 'shadow-[0_18px_50px_rgba(0,0,0,0.35)] ') + (chatExpanded

            : 'left-20 right-3 bottom-28 h-[54%] rounded-[1.75rem]')"
        >
          <div 
            @pointerdown="startDrag($event, 'showChat')"
            @pointermove="moveDrag($event)"
            @pointerup="endDrag($event, 'showChat')"
            @pointercancel="endDrag($event, 'showChat')"
            class="flex justify-center pt-1.5 pb-2 touch-none select-none cursor-grab active:cursor-grabbing shrink-0"
          >
            <div class="w-10 h-1.5 rounded-full bg-black/20 dark:bg-white/30 transition-colors" :class="dragging ? 'bg-slate-900 dark:bg-white' : ''"></div>
          </div>

            </span>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-bold text-slate-900 dark:text-white leading-tight">Nasrin AI</p>
              <p class="text-[10px] font-semibold flex items-center" :class="chatTyping ? 'text-slate-500 dark:text-white/55' : 'text-emerald-600 dark:text-emerald-400'">
                <span class="w-1.5 h-1.5 rounded-full mr-1.5 animate-pulse" :class="chatTyping ? 'bg-slate-400 dark:bg-white/60' : 'bg-emerald-500'"></span>
                <span x-text="chatTyping ? 'Typing…' : (chatListening ? 'Listening…' : 'Online')"></span>
              </p>
            </div>
            <div class="flex items-center gap-1 shrink-0">
            <button @click="chatExpanded = !chatExpanded" :aria-label="chatExpanded ? 'Shrink the chat' : 'Expand the chat'" class="w-9 h-9 p-0 shrink-0 rounded-full flex items-center justify-center text-slate-500 dark:text-white/60 hover:bg-black/5 dark:hover:bg-white/10 tap-active">
              <span class="flex items-center justify-center" x-show="!chatExpanded"><svg viewBox="0 0 24 24" class="w-4 h-4 block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></span><span class="flex items-center justify-center" x-show="chatExpanded"><svg viewBox="0 0 24 24" class="w-4 h-4 block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></span>
            </button>
            <button @click="chatToggleGender()" :aria-label="chatGender === 'male' ? 'Voice: male. Tap for female' : 'Voice: female. Tap for male'" class="h-9 px-2.5 shrink-0 rounded-full flex items-center justify-center text-[11px] font-bold text-slate-500 dark:text-white/60 hover:bg-black/5 dark:hover:bg-white/10 tap-active"><span x-text="chatGender === 'male' ? 'Male' : 'Female'"></span></button>
            <button @click="chatToggleSpeech()" :aria-label="chatSpeech ? 'Turn voice replies off' : 'Turn voice replies on'" class="w-9 h-9 p-0 shrink-0 rounded-full flex items-center justify-center text-slate-500 dark:text-white/60 hover:bg-black/5 dark:hover:bg-white/10 tap-active" :class="chatSpeech ? 'text-slate-900 dark:text-white bg-black/5 dark:bg-white/10' : ''">
              <span class="flex items-center justify-center" x-show="chatSpeech"><svg viewBox="0 0 24 24" class="w-4 h-4 block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 4.9a10 10 0 0 1 0 14.2"/></svg></span><span class="flex items-center justify-center" x-show="!chatSpeech"><svg viewBox="0 0 24 24" class="w-4 h-4 block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg></span>
            </button>
            <button @click="chatClear()" aria-label="Clear chat" class="w-9 h-9 p-0 shrink-0 rounded-full flex items-center justify-center text-slate-500 dark:text-white/60 hover:bg-black/5 dark:hover:bg-white/10 tap-active"><svg viewBox="0 0 24 24" class="w-4 h-4 block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
            <button @click="showChat = false" aria-label="Close chat" class="w-9 h-9 p-0 shrink-0 rounded-full flex items-center justify-center text-slate-500 dark:text-white/60 hover:bg-black/5 dark:hover:bg-white/10 tap-active"><svg viewBox="0 0 24 24" class="w-4 h-4 block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
          </div>

          <!-- conversation -->
          <div x-ref="chatScroll" class="flex-1 overflow-y-auto no-scrollbar px-5 py-4 space-y-3">
            <template x-for="m in chatLog" :key="m.id">
              <div>
                <div class="flex" :class="m.role === 'user' ? 'justify-end' : 'justify-start'">
                  <div 
                    class="chat-bubble text-xs px-3.5 py-2.5 rounded-2xl whitespace-pre-line"
                    :class="m.role === 'user' ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 font-semibold rounded-br-md border-r-2 border-yellow-500' : 'bg-black/5 dark:bg-white/10 text-slate-800 dark:text-white/90 rounded-bl-md'"
                    x-text="m.text"
                  ></div>
                </div>
                <div x-show="m.actions && m.actions.length" class="flex flex-wrap gap-2 mt-2" :class="m.role === 'user' ? 'justify-end' : ''">
                  <template x-for="(a, ai) in m.actions" :key="ai">
                    <button @click="chatAction(a)" class="text-[11px] font-bold px-3 py-1.5 rounded-full border tap-active transition-colors"
                      :class="a.act === 'callsupport'
                        ? 'bg-yellow-500 text-black border-yellow-500 shadow-md shadow-yellow-500/25'
                        : 'bg-black/5 dark:bg-white/10 text-slate-700 dark:text-white/85 border-black/10 dark:border-white/15 hover:bg-black/10 dark:hover:bg-white/20'"
                      x-text="a.label"></button>
                  </template>
                </div>
              </div>
            </template>
            <div x-show="chatTyping" class="flex justify-start">
              <div class="chat-dots bg-black/5 dark:bg-white/10 text-slate-500 dark:text-white/70 px-4 py-3 rounded-2xl rounded-bl-md">
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>

          <!-- suggestions, until the conversation gets going -->
          <div x-show="chatLog.length &lt; 3" class="px-5 pb-2 shrink-0">
            <div class="flex space-x-2 overflow-x-auto no-scrollbar">
              <template x-for="q in chatSuggestions" :key="q">
                <button @click="chatSend(q)" class="text-[11px] font-semibold whitespace-nowrap px-3 py-1.5 rounded-full bg-black/5 dark:bg-white/10 text-slate-600 dark:text-white/75 tap-active" x-text="q"></button>
              </template>
            </div>
          </div>

          <!-- listening -->
          <div x-show="chatListening || chatConvo" class="mx-5 mb-2 px-3.5 py-2 rounded-full bg-black/5 dark:bg-white/10 border border-black/10 dark:border-white/15 flex items-center space-x-2.5 shrink-0">
            <span class="chat-viz text-slate-700 dark:text-white/80 flex items-center h-4"><span></span><span></span><span></span><span></span><span></span></span>
            <span class="flex-1 min-w-0 text-[11px] font-semibold text-slate-700 dark:text-white/80 truncate" x-text="chatHeard || (chatListening ? 'Listening…' : 'Conversation on — tap the mic to stop')"></span>
            <button @click="chatStopListening()" aria-label="Stop listening" class="w-7 h-7 rounded-full bg-black/5 dark:bg-white/10 text-slate-600 dark:text-white/70 inline-flex items-center justify-center shrink-0 tap-active"><svg viewBox="0 0 24 24" class="w-3.5 h-3.5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          </div>

          <!-- input -->
          <div class="px-4 min-[360px]:px-5 pt-1 flex items-center gap-2 shrink-0" :class="chatExpanded ? 'pb-0' : 'pb-4'">
            <button 
              @click="chatToggleMic()"
              aria-label="Speak your message"
              class="w-9 h-9 min-[360px]:w-10 min-[360px]:h-10 rounded-full flex items-center justify-center shrink-0 border transition-colors tap-active"
              :class="(chatListening || chatConvo) ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 border-transparent' : 'bg-black/5 dark:bg-white/10 text-slate-600 dark:text-white/75 border-black/10 dark:border-white/10'"
            ><svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
            <input 
              id="chatInput"
              x-model="chatDraft"
              @keydown.enter="chatSend()"
              type="text"
              maxlength="500"
              placeholder="Message…"
              aria-label="Message Nasrin"
              class="flex-1 min-w-0 bg-white dark:bg-white/10 text-sm px-3.5 py-2.5 rounded-full border border-black/10 dark:border-white/10 focus:outline-none focus:border-slate-900 dark:focus:border-white text-slate-900 dark:text-white placeholder-slate-400 font-medium"
            />
            <button @click="chatSend()" aria-label="Send" class="w-9 h-9 min-[360px]:w-10 min-[360px]:h-10 rounded-full bg-yellow-500 text-black flex items-center justify-center shrink-0 shadow-md shadow-yellow-500/25 tap-active"><svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
          </div>
        </div>
      </div>
    </div>
